[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predoc-tracker"
version = "0.0.1"
description = "Monitor PREDOC opportunities while preserving research-grade scrape provenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "certifi>=2024.2.2",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.scripts]
predoc-tracker = "predoc_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
